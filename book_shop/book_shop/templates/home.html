<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Store</title>
</head>
<body>
    {% if user.is_authenticated %}
    Hi, {{user.email}}
        {% if user.is_superuser %}
        <br><br>
        <a href="{%url 'admin:index' %}">Admin</a>&nbsp&nbsp&nbsp<a href="{%url 'book_list' %}">Books</a>
        <br>
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit">Log Out</button>
        </form>
        {% else %}
        <br><br>
        <a href="{%url 'book_list' %}">Books</a>
        <br>
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit">Log Out</button>
        </form>
        {% endif %}

    {% else %}
    <p>You are not logged in</p>
    <a href="{%url 'login' %}">Log in</a>&nbsp&nbsp&nbsp<a href="{%url 'registration' %}">Sign up</a>
    {% endif %}
</body>
</html>
