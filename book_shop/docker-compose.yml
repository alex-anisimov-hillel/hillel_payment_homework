services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/redis_data
    command: redis-server --requirepass "your_secure_password" --appendonly yes
    restart: always
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "chmod +x entrypoint.sh && ./entrypoint.sh && python manage.py collectstatic --noinput && uvicorn book_shop.asgi:application --reload --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app
      - django_static:/app/staticfiles
      - healthchecks:/app/healthchecks
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      books_db:
        condition: service_healthy
    networks:
      - books_shop_network
  books_db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - books_shop_network

networks:
  books_shop_network:
    driver: bridge

volumes:
  django_static:
  healthchecks:
  redis_data: